name: Migrar grupo GitLab a GitHub

on:
  workflow_dispatch:
    inputs:
      group_gitlab:
        description: "Grupo de GitLab"
        required: true
        type: string

      owner:
        description: "Organización de GitHub"
        required: true
        type: string

jobs:
  migrar:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. DESCARGAR EL REPOSITORIO DE MIGRACIÓN
      # ============================================================

      - name: Descargar repositorio
        uses: actions/checkout@v4


      # ============================================================
      # 2. INSTALAR jq
      # ============================================================

      - name: Instalar jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq


      # ============================================================
      # 3. INSTALAR GITHUB CLI
      # ============================================================

      - name: Instalar GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.TOKEN_GITHUB }}
        run: |
          sudo apt-get install -y gh
          gh --version


      # ============================================================
      # 4. INSTALAR ACTIONS IMPORTER
      # ============================================================

      - name: Instalar GitHub Actions Importer
        env:
          GH_TOKEN: ${{ secrets.TOKEN_GITHUB }}
        run: |
          gh extension install github/gh-actions-importer
          gh actions-importer version


      # ============================================================
      # 5. VERIFICAR DOCKER
      # ============================================================

      - name: Verificar Docker
        run: |
          docker --version
          docker info


      # ============================================================
      # 6. PERMISOS A LOS SCRIPTS
      # ============================================================

      - name: Dar permisos a los scripts
        run: |
          chmod +x scripts/migrar-repositorios.sh
          chmod +x scripts/validar-integridad-migracion.sh


      # ============================================================
      # 7. OBTENER PROYECTOS DEL GRUPO
      # ============================================================

      - name: Obtener proyectos de GitLab
        env:
          TOKEN_GITLAB: ${{ secrets.TOKEN_GITLAB }}
          GROUP_GITLAB: ${{ inputs.group_gitlab }}
        run: |

          echo "========================================"
          echo "OBTENIENDO PROYECTOS DEL GRUPO"
          echo "========================================"

          mkdir -p projects

          curl --fail --silent --show-error \
            --header "PRIVATE-TOKEN: ${TOKEN_GITLAB}" \
            "https://gitlab.com/api/v4/groups/${GROUP_GITLAB}/projects?per_page=100&page=1" \
            > projects/gitlab-projects.json

          echo ""
          echo "PROYECTOS ENCONTRADOS:"
          
          jq -r '.[].path' projects/gitlab-projects.json

          TOTAL=$(jq 'length' projects/gitlab-projects.json)

          echo ""
          echo "TOTAL DE PROYECTOS: $TOTAL"

          if [ "$TOTAL" -eq 0 ]; then
            echo "ERROR: No se encontraron proyectos"
            exit 1
          fi


      # ============================================================
      # 8. MIGRAR TODOS LOS REPOSITORIOS
      # ============================================================

      - name: Migrar repositorios GitLab → GitHub
        env:
          TOKEN_GITLAB: ${{ secrets.TOKEN_GITLAB }}
          TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
          GROUP_GITLAB: ${{ inputs.group_gitlab }}
          OWNER: ${{ inputs.owner }}

        run: |

          echo "========================================"
          echo "INICIO DE MIGRACIÓN DEL GRUPO"
          echo "========================================"

          jq -c '.[]' projects/gitlab-projects.json |
          while read -r proyecto
          do

            PROJECT_GITLAB=$(echo "$proyecto" | jq -r '.path')
            PROJECT_NAME=$(echo "$proyecto" | jq -r '.name')
            PROJECT_URL=$(echo "$proyecto" | jq -r '.http_url_to_repo')
            DESCRIPTION=$(echo "$proyecto" | jq -r '.description // ""')

            echo ""
            echo "========================================"
            echo "PROYECTO: $PROJECT_NAME"
            echo "PATH: $PROJECT_GITLAB"
            echo "========================================"

            # ------------------------------------------------------
            # Comprobar si existe en GitHub
            # ------------------------------------------------------

            HTTP_CODE=$(curl -o /dev/null -s -w "%{http_code}" \
              -H "Authorization: Bearer ${TOKEN_GITHUB}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${OWNER}/${PROJECT_GITLAB}")

            if [ "$HTTP_CODE" == "200" ]; then

              echo "REPOSITORIO YA EXISTE EN GITHUB"

            else

              echo "REPOSITORIO NO EXISTE EN GITHUB"
              echo "CREANDO REPOSITORIO..."

              curl --fail --silent --show-error \
                -X POST \
                -H "Authorization: Bearer ${TOKEN_GITHUB}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/orgs/${OWNER}/repos" \
                -d "$(jq -n \
                  --arg name "$PROJECT_GITLAB" \
                  --arg description "$DESCRIPTION" \
                  '{
                    name: $name,
                    description: $description,
                    private: true
                  }'
                )"

              echo ""
              echo "REPOSITORIO CREADO"

            fi

            # ------------------------------------------------------
            # Crear carpeta de trabajo
            # ------------------------------------------------------

            rm -rf "./migracion"

            mkdir -p "./migracion"

            cd "./migracion"

            # ------------------------------------------------------
            # Preparar URL autenticada de GitLab
            # ------------------------------------------------------

            URL_GITLAB_AUTH="${PROJECT_URL/https:\/\/gitlab.com/https:\/\/oauth2:${TOKEN_GITLAB}@gitlab.com}"

            # ------------------------------------------------------
            # Clonar GitLab como mirror
            # ------------------------------------------------------

            echo ""
            echo "CLONANDO GITLAB..."

            git clone --mirror "$URL_GITLAB_AUTH" repositorio.git

            if [ $? -ne 0 ]; then
              echo "ERROR: No se pudo clonar $PROJECT_GITLAB"
              cd ..
              continue
            fi

            cd repositorio.git

            # ------------------------------------------------------
            # Verificar referencias
            # ------------------------------------------------------

            TOTAL_REFS=$(git show-ref | wc -l)

            echo "TOTAL DE REFERENCIAS: $TOTAL_REFS"

            if [ "$TOTAL_REFS" -eq 0 ]; then
              echo "ERROR: Repositorio sin referencias"
              cd ../..
              continue
            fi

            # ------------------------------------------------------
            # Configurar URL GitHub
            # ------------------------------------------------------

            URL_GITHUB="https://x-access-token:${TOKEN_GITHUB}@github.com/${OWNER}/${PROJECT_GITLAB}.git"

            git remote set-url origin "$URL_GITHUB"

            # ------------------------------------------------------
            # Push completo
            # ------------------------------------------------------

            echo ""
            echo "PUSH MIRROR A GITHUB..."

            git push --mirror origin

            if [ $? -ne 0 ]; then
              echo "ERROR: Falló el push de $PROJECT_GITLAB"
              cd ../..
              continue
            fi

            echo ""
            echo "MIGRACIÓN COMPLETADA: $PROJECT_GITLAB"

            cd ../..

          done


      # ============================================================
      # 9. CONVERTIR PIPELINES CON ACTIONS IMPORTER
      # ============================================================

      - name: Convertir pipelines GitLab → GitHub Actions
        env:
          GH_TOKEN: ${{ secrets.TOKEN_GITHUB }}

          GITHUB_ACCESS_TOKEN: ${{ secrets.TOKEN_GITHUB }}
          GITHUB_INSTANCE_URL: https://github.com

          GITLAB_ACCESS_TOKEN: ${{ secrets.TOKEN_GITLAB }}
          GITLAB_INSTANCE_URL: https://gitlab.com

          GROUP_GITLAB: ${{ inputs.group_gitlab }}

        run: |

          echo "========================================"
          echo "INICIO DE CONVERSIÓN DE PIPELINES"
          echo "========================================"

          mkdir -p output

          jq -r '.[].path' projects/gitlab-projects.json |
          while read -r PROJECT_GITLAB
          do

            echo ""
            echo "========================================"
            echo "CONVIRTIENDO: $PROJECT_GITLAB"
            echo "========================================"

            mkdir -p "output/${PROJECT_GITLAB}"

            # ------------------------------------------------------
            # Intentar convertir pipeline
            # ------------------------------------------------------

            gh actions-importer dry-run gitlab \
              --namespace "$GROUP_GITLAB" \
              --project "$PROJECT_GITLAB" \
              --output-dir "output/${PROJECT_GITLAB}" || {

                echo ""
                echo "ADVERTENCIA:"
                echo "No se pudo convertir el pipeline de $PROJECT_GITLAB"
                echo "Puede que no tenga .gitlab-ci.yml"
                continue
              }

            echo ""
            echo "CONVERSIÓN COMPLETADA: $PROJECT_GITLAB"

          done


      # ============================================================
      # 10. PUBLICAR WORKFLOWS EN CADA REPOSITORIO
      # ============================================================

      - name: Publicar workflows convertidos
        env:
          TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
          OWNER: ${{ inputs.owner }}

        run: |

          echo "========================================"
          echo "PUBLICANDO WORKFLOWS"
          echo "========================================"

          for PROJECT_DIR in output/*
          do

            if [ ! -d "$PROJECT_DIR" ]; then
              continue
            fi

            PROJECT_GITLAB=$(basename "$PROJECT_DIR")

            echo ""
            echo "========================================"
            echo "PROYECTO: $PROJECT_GITLAB"
            echo "========================================"

            # ------------------------------------------------------
            # Buscar workflow generado
            # ------------------------------------------------------

            WORKFLOW=$(find "$PROJECT_DIR" \
              -type f \
              \( -name "*.yml" -o -name "*.yaml" \) \
              | head -n 1)

            if [ -z "$WORKFLOW" ]; then

              echo "No se encontró workflow para $PROJECT_GITLAB"
              continue

            fi

            echo "WORKFLOW ENCONTRADO:"
            echo "$WORKFLOW"

            # ------------------------------------------------------
            # Clonar repositorio GitHub
            # ------------------------------------------------------

            rm -rf "./repositorio-final"

            git clone \
              "https://x-access-token:${TOKEN_GITHUB}@github.com/${OWNER}/${PROJECT_GITLAB}.git" \
              "./repositorio-final"

            cd "./repositorio-final"

            # ------------------------------------------------------
            # Crear carpeta workflows
            # ------------------------------------------------------

            mkdir -p ".github/workflows"

            # ------------------------------------------------------
            # Copiar workflow
            # ------------------------------------------------------

            cp "../../${WORKFLOW}" \
              ".github/workflows/${PROJECT_GITLAB}.yml"

            echo ""
            echo "WORKFLOW COPIADO"

            # ------------------------------------------------------
            # Configurar Git
            # ------------------------------------------------------

            git config user.name "github-actions[bot]"

            git config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"

            # ------------------------------------------------------
            # Commit
            # ------------------------------------------------------

            git add ".github/workflows/"

            if git diff --cached --quiet; then

              echo "No hay cambios para publicar"

            else

              git commit \
                -m "chore: migrate GitLab CI pipeline to GitHub Actions"

              # ----------------------------------------------------
              # Push
              # ----------------------------------------------------

              git push origin HEAD

              echo ""
              echo "WORKFLOW PUBLICADO: $PROJECT_GITLAB"

            fi

            cd ..

          done


      # ============================================================
      # 11. RESUMEN
      # ============================================================

      - name: Resumen
        env:
          GROUP_GITLAB: ${{ inputs.group_gitlab }}
          OWNER: ${{ inputs.owner }}

        run: |

          echo ""
          echo "========================================"
          echo "MIGRACIÓN DEL GRUPO FINALIZADA"
          echo "========================================"

          echo ""
          echo "GRUPO GITLAB:"
          echo "$GROUP_GITLAB"

          echo ""
          echo "ORGANIZACIÓN GITHUB:"
          echo "$OWNER"

          echo ""
          echo "PROYECTOS:"
          jq -r '.[].path' projects/gitlab-projects.json

          echo ""
          echo "========================================"
