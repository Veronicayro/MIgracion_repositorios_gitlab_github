name: Migrar y convertir repositorio GitLab a GitHub

on:
  workflow_dispatch:
    inputs:
      group_gitlab:
        description: "Grupo de GitLab"
        required: true
        type: string

      project_gitlab:
        description: "Repositorio de GitLab"
        required: true
        type: string

      owner:
        description: "Organización de GitHub"
        required: true
        type: string

jobs:
  migrar:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. DESCARGAR EL REPOSITORIO DEL SCRIPT
      # ============================================================

      - name: Descargar repositorio de migración
        uses: actions/checkout@v4

      # ============================================================
      # 2. INSTALAR jq
      # ============================================================

      - name: Instalar jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      # ============================================================
      # 3. INSTALAR GITHUB CLI
      # ============================================================

      - name: Instalar GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.TOKEN_GITHUB }}
        run: |
          sudo apt-get install -y gh
          gh --version

      # ============================================================
      # 4. INSTALAR GITHUB ACTIONS IMPORTER
      # ============================================================

      - name: Instalar GitHub Actions Importer
        env:
          GH_TOKEN: ${{ secrets.TOKEN_GITHUB }}
        run: |
          gh extension install github/gh-actions-importer
          gh actions-importer version

      # ============================================================
      # 5. VERIFICAR DOCKER
      # ============================================================

      - name: Verificar Docker
        run: |
          docker --version
          docker info

      # ============================================================
      # 6. DAR PERMISOS A LOS SCRIPTS
      # ============================================================

      - name: Dar permisos a los scripts
        run: |
          chmod +x scripts/migrar-repositorios.sh
          chmod +x scripts/validar-integridad-migracion.sh

      # ============================================================
      # 7. MIGRAR REPOSITORIO GITLAB → GITHUB
      # ============================================================

      - name: Ejecutar migración GitLab → GitHub
        env:
          TOKEN_GITLAB: ${{ secrets.TOKEN_GITLAB }}
          GROUP_GITLAB: ${{ inputs.group_gitlab }}
          PROJECT_GITLAB: ${{ inputs.project_gitlab }}
          TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
          OWNER: ${{ inputs.owner }}
        run: |
          ./scripts/migrar-repositorios.sh

      # ============================================================
      # 8. CONVERTIR PIPELINE GITLAB → GITHUB ACTIONS
      # ============================================================

      - name: Convertir pipeline con Actions Importer
        env:
          GH_TOKEN: ${{ secrets.TOKEN_GITHUB }}

          GITHUB_ACCESS_TOKEN: ${{ secrets.TOKEN_GITHUB }}
          GITHUB_INSTANCE_URL: https://github.com

          GITLAB_ACCESS_TOKEN: ${{ secrets.TOKEN_GITLAB }}
          GITLAB_INSTANCE_URL: https://gitlab.com

          GROUP_GITLAB: ${{ inputs.group_gitlab }}
          PROJECT_GITLAB: ${{ inputs.project_gitlab }}

        run: |

          echo "========================================"
          echo "CONVIRTIENDO PIPELINE"
          echo "========================================"

          mkdir -p output

          gh actions-importer dry-run gitlab \
            --namespace "$GROUP_GITLAB" \
            --project "$PROJECT_GITLAB" \
            --output-dir ./output

      # ============================================================
      # 9. BUSCAR WORKFLOW GENERADO
      # ============================================================

      - name: Buscar workflow generado
        run: |

          echo "========================================"
          echo "ARCHIVOS GENERADOS"
          echo "========================================"

          find ./output -type f -print

          echo ""

          WORKFLOW=$(find ./output \
            -type f \
            \( -name "*.yml" -o -name "*.yaml" \) \
            | head -n 1)

          if [ -z "$WORKFLOW" ]; then
            echo "ERROR: Actions Importer no generó ningún workflow"
            exit 1
          fi

          echo "WORKFLOW ENCONTRADO:"
          echo "$WORKFLOW"

      # ============================================================
      # 10. COPIAR WORKFLOW AL REPOSITORIO MIGRADO
      # ============================================================

      - name: Copiar workflow al repositorio GitHub
        env:
          GROUP_GITLAB: ${{ inputs.group_gitlab }}
          PROJECT_GITLAB: ${{ inputs.project_gitlab }}
          OWNER: ${{ inputs.owner }}
        run: |

          echo "========================================"
          echo "PUBLICANDO WORKFLOW EN GITHUB"
          echo "========================================"

          WORKFLOW=$(find ./output \
            -type f \
            \( -name "*.yml" -o -name "*.yaml" \) \
            | head -n 1)

          if [ -z "$WORKFLOW" ]; then
            echo "ERROR: No se encontró workflow generado"
            exit 1
          fi

          echo "Workflow generado:"
          echo "$WORKFLOW"

          # Crear carpeta temporal para el repositorio migrado
          rm -rf ./repositorio-final

          mkdir -p ./repositorio-final

          # Clonar el repositorio de GitHub
          git clone \
            "https://x-access-token:${TOKEN_GITHUB}@github.com/${OWNER}/${PROJECT_GITLAB}.git" \
            ./repositorio-final

          cd ./repositorio-final

          # Crear carpeta de workflows
          mkdir -p .github/workflows

          # Copiar workflow generado
          cp "../$WORKFLOW" \
            ".github/workflows/${PROJECT_GITLAB}.yml"

          echo ""
          echo "WORKFLOW COPIADO:"
          ls -la .github/workflows/

          echo ""
          echo "CONTENIDO:"
          cat ".github/workflows/${PROJECT_GITLAB}.yml"

      # ============================================================
      # 11. CONFIGURAR GIT
      # ============================================================

      - name: Configurar Git
        working-directory: ./repositorio-final
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # ============================================================
      # 12. COMMIT DEL WORKFLOW
      # ============================================================

      - name: Commit del workflow convertido
        working-directory: ./repositorio-final
        run: |

          echo "========================================"
          echo "CREANDO COMMIT"
          echo "========================================"

          git add .github/workflows/

          if git diff --cached --quiet; then
            echo "No hay cambios para hacer commit"
            exit 0
          fi

          git commit \
            -m "chore: migrate GitLab CI pipeline to GitHub Actions"

      # ============================================================
      # 13. PUSH DEL WORKFLOW
      # ============================================================

      - name: Publicar workflow en GitHub
        working-directory: ./repositorio-final
        env:
          TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
        run: |

          echo "========================================"
          echo "PUBLICANDO WORKFLOW"
          echo "========================================"

          git push origin HEAD

          echo ""
          echo "WORKFLOW PUBLICADO CORRECTAMENTE"

      # ============================================================
      # 14. RESUMEN
      # ============================================================

      - name: Resumen de migración
        env:
          GROUP_GITLAB: ${{ inputs.group_gitlab }}
          PROJECT_GITLAB: ${{ inputs.project_gitlab }}
          OWNER: ${{ inputs.owner }}
        run: |

          echo ""
          echo "========================================"
          echo "MIGRACIÓN COMPLETADA"
          echo "========================================"

          echo ""
          echo "GitLab:"
          echo "${GROUP_GITLAB}/${PROJECT_GITLAB}"

          echo ""
          echo "GitHub:"
          echo "${OWNER}/${PROJECT_GITLAB}"

          echo ""
          echo "Workflow:"
          echo ".github/workflows/${PROJECT_GITLAB}.yml"

          echo ""
          echo "========================================"
