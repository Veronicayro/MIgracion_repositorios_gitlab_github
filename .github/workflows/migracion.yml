name: Migrar repositorios

on:
  workflow_dispatch:
    inputs:
      organizacion_github:
        description: "Organización Github"
        required: true
        type: string

      grupo_gitlab:
        description: "Grupo Gitlab"
        required: false
        type: string

      port_run_id:
        description: ID de la ejecución en Port
        required: false
        type: string

permissions:
  contents: read

jobs:
  migrar:
    name: Ejecutar migración de repositorios
    runs-on: ubuntu-latest

    # Todas estas variables estarán disponibles para los tres scripts.
    env:
      # Variables recibidas desde Port
      GROUP_GITLAB: ${{ inputs.grupo_gitlab }}
      OWNER: ${{ inputs.organizacion_github }}

      # Variables de configuración del repositorio en GitHub:
      # Settings > Secrets and variables > Actions > Variables
      TOKEN_GITHUB: ${{ vars.TOKEN_GITHUB }}
      TOKEN_GITLAB: ${{ vars.TOKEN_GITLAB }}

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Ejecutar migración
        shell: bash
        run: |
          chmod +x migrate/ejecutar_proceso_migracion.sh
          ./migrate/ejecutar_proceso_migracion.sh


  report:
    name: Informar a Port
    needs: [migrar]
    if: always() && inputs.port_run_id != ''
    runs-on: ubuntu-latest
    steps:
      - name: Informar éxito a Port
        if: ${{ needs.migrar.result == 'success' }}
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID_ORG }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET_ORG }}
          baseUrl: https://api.us.port.io
          operation: PATCH_RUN
          runId: ${{ inputs.port_run_id }}
          status: SUCCESS
          logMessage: El Proceso de Migración Realizada Correctamente (revisar el log para ver detalles importantes)
          link: '["${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"]'

      - name: Informar fallo a Port
        if: ${{ needs.migrar.result != 'success' }}
        uses: port-labs/port-github-action@v1
        with:
          clientId: ${{ secrets.PORT_CLIENT_ID_ORG }}
          clientSecret: ${{ secrets.PORT_CLIENT_SECRET_ORG }}
          baseUrl: https://api.us.port.io
          operation: PATCH_RUN
          runId: ${{ inputs.port_run_id }}
          status: FAILURE
          logMessage: El Proceso de Migración tuvo varios errores (revisar el log para ver los detalles)
          link: '["${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"]'